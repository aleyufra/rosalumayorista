faq:
  - question: ¿Cuál es el mínimo?
    answer: 3 productos en total. Pueden ser iguales o distintos, y las unidades del mismo producto también cuentan.
  - question: ¿Se puede comprar surtido?
    answer: Sí. Podés mezclar ropa, juguetería y bazar en el mismo pedido para llegar al mínimo.
  - question: ¿Hacen envíos?
    answer: Por el momento no, armás tu pedido, te lo confirmamos por WhatsApp y lo retirás en el local de calle Gorriti.
  - question: ¿Aceptan transferencia?
    answer: Sí. Pagando en efectivo tenés el precio especial que ves publicado. Por transferencia hay un recargo de {recargo} por producto.
  - question: ¿Cómo son los cambios?
    answer: Si el producto vino fallado o necesitás otro talle o color, lo traés dentro de las 24 horas con el ticket, sin uso y con la etiqueta, y te lo cambiamos. Es un cambio, no devolvemos dinero.
  - question: ¿Aceptan Mercado Pago?
    answer: Aceptamos transferencias bancarias pero con un recargo de {recargo} por producto.
copy:
  heroSubtitle: Ropa, juguetería y bazar. Visitá y armá tu pedido como quieras y retiralo en nuestro local de Jujuy.
  trust:
    - title: Local en el centro
      text: Venís, lo ves y te lo llevás. Estamos en calle Gorriti.
    - title: Cambio en 24 horas
      text: Si vino fallado o necesitás otro talle o color, te lo cambiamos.
    - title: Precio especial en efectivo
      text: El precio publicado es el que pagás en efectivo. Sin sorpresas.
    - title: El mismo trato
      text: Compres 3 o compres 30, te atendemos igual.
  howToBuy:
    - title: Mirás el catálogo y armás tu pedido
      text: Todos los productos tienen el precio publicado. Elegí talle, color y cantidad.
    - title: Lo mandás por WhatsApp y te confirmamos
      text: El pedido sale armado con un toque. Te respondemos con la disponibilidad.
    - title: Venís al local, lo ves, pagás y te lo llevás
      text: Lo revisás en el mostrador y recién ahí pagás.
  guarantee: Si el producto vino fallado o necesitás otro talle o color, lo traés dentro de las 24 horas y te lo cambiamos.
  guaranteeConditions:
    - Traé el ticket de compra.
    - El producto tiene que estar sin uso y con la etiqueta.
    - Es un cambio, no una devolución de dinero.
  closingTitle: Vení a Rosalu y llevate lo que más te guste al mejor precio
  closingText: Mirá el catálogo, mandanos tu pedido o pasá nomás por el local.
